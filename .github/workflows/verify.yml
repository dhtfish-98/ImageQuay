name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-15
    env:
      TMPDIR: ${{ github.workspace }}/Build/tmp
      TMP: ${{ github.workspace }}/Build/tmp
      TEMP: ${{ github.workspace }}/Build/tmp
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/Build/缓存/python
      PIP_CACHE_DIR: ${{ github.workspace }}/Build/缓存/pip
      npm_config_cache: ${{ github.workspace }}/Build/缓存/npm
      RUFF_CACHE_DIR: ${{ github.workspace }}/Build/缓存/ruff
      GOCACHE: ${{ github.workspace }}/Build/缓存/go
      GOMODCACHE: ${{ github.workspace }}/Build/缓存/go-mod
      GOTMPDIR: ${{ github.workspace }}/Build/临时
      GOPATH: ${{ github.workspace }}/Build/缓存/go-path
      GOBIN: ${{ github.workspace }}/Build/输出/go-bin
      CARGO_HOME: ${{ github.workspace }}/Build/缓存/cargo
      XDG_CACHE_HOME: ${{ github.workspace }}/Build/缓存/xdg
      CCACHE_DIR: ${{ github.workspace }}/Build/缓存/ccache
      SCCACHE_DIR: ${{ github.workspace }}/Build/缓存/sccache
      NODE_COMPILE_CACHE: ${{ github.workspace }}/Build/缓存/node
      PYTHONDONTWRITEBYTECODE: '1'
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    defaults:
      run:
        working-directory: ${{ github.workspace }}/Build/源码
    steps:
      - uses: actions/checkout@v4
      - name: Stage source and restored project inputs under Build
        run: |
          ${{ runner.os == 'Windows' && 'python' || 'python3' }} 构建.py --stage --ci
          mkdir -p "$TMPDIR"
        working-directory: ${{ github.workspace }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python checks/build_fixtures.py
      - uses: actions/checkout@v4
        with:
          repository: 0cyn/ktool
          ref: faed829b838dc4060b7e36f90239a52cd37f2a45
          path: 'Build/源码/_upstream'
      - run: python -m pip install -r requirements-test.lock
      - run: python -m pip install -e .
      - run: python -m pytest -q -p no:cacheprovider
      - run: python checks/compare_upstream.py --upstream-root _upstream
      - run: python -m build
      - run: python -m venv .consumer
      - run: .consumer/bin/python -m pip install dist/*.whl
      - run: .consumer/bin/python -I checks/consume_installation.py
      - run: .consumer/bin/python -I checks/consume_editing_cli.py
