[build-system]
requires=["setuptools==80.10.2", "wheel==0.48.0"]
build-backend="setuptools.build_meta"
[project]
name="imagequay"
version="2.1.2"
description="ImageQuay attributed derivative for offline developer analysis"
readme="README.md"
requires-python=">=3.9"
license={file="LICENSE"}
dependencies=["Pygments==2.21.0", "setuptools==80.10.2", "windows-curses>=2.3.1;sys_platform==\"win32\""]
[project.optional-dependencies]
test=["pytest"]
[project.scripts]
"imagequay"="imagequay.console:quay_main"
[tool.setuptools.packages.find]
where=["src"]
[tool.setuptools.package-data]
"*"=["*.codes", "data/*.json", "data/*.config"]
[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["checks"]
