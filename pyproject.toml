[build-system]
requires=["setuptools==80.10.2", "wheel==0.48.0"]
build-backend="setuptools.build_meta"
[project]
name="imagequay"
version="1.0.2"
description="ImageQuay attributed derivative for offline developer analysis"
readme="README.md"
requires-python=">=3.9"
license={file="LICENSE"}
dependencies=["Pygments==2.21.0", "packaging==26.3", "windows-curses>=2.3.1;sys_platform==\"win32\""]
[project.optional-dependencies]
test=["pytest"]
[project.scripts]
"imagequay"="imagequay.console:quay_main"
[tool.setuptools.packages.find]
where=["src"]
[tool.setuptools.package-data]
"*"=["*.codes", "data/*.json", "data/*.config"]
[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["checks"]

[tool.setuptools.cmdclass]
build_py="imagequay_delivery_build.DeliveryBuild"

[tool.setuptools]
py-modules=["imagequay_delivery_build"]

[tool.setuptools.data-files]
"share/imagequay"=["README.md", "ORIGIN.md", "VALIDATION.md", "DEFENSIVE_SCOPE.md", "THIRD_PARTY_NOTICES.md"]
"share/imagequay/licenses"=["LICENSE", "EXTERNAL_LICENSES/CPYTHON_LICENSE", "EXTERNAL_LICENSES/MACHOVIEW_CHAINEDFIXUP_APACHE_LICENSE"]
